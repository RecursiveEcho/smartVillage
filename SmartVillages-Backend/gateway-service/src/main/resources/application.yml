server:
  port: 8090

spring:
  application:
    name: gateway-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
    gateway:
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**

        - id: admin-service-on-auth
          uri: lb://admin-service
          predicates:
            - Path=/admin/**

        - id: media-service
          uri: lb://media-service
          predicates:
            - Path=/media/**

        - id: business-service-direct
          uri: lb://business-service
          predicates:
            - Path=/announcements/**,/interactions/**,/cadre/**,/villager/**,/public/**,/features/**

        - id: business-service
          uri: lb://business-service
          predicates:
            - Path=/api/**
          filters:
            - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: health,info
