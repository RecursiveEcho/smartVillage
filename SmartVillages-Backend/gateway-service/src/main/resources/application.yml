server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8082
          predicates:
            - Path=/auth/**

        - id: business-admin-feature
          uri: http://localhost:8081
          predicates:
            - Path=/admin/features/**

        - id: admin-service-on-auth
          uri: http://localhost:8082
          predicates:
            - Path=/admin/**

        - id: media-service
          uri: http://localhost:8083
          predicates:
            - Path=/media/**

        - id: business-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/**
          filters:
            - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: health,info
